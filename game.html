<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Neon Snake — built from one prompt</title>
<style>
  html,body{margin:0;padding:0;background:#0b0b14;height:100%;overflow:hidden;
    font-family:ui-monospace,Menlo,Consolas,monospace;color:#e8e8f0}
  #wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%}
  h1{margin:0 0 4px;font-size:22px;letter-spacing:4px;color:#39ff88;
     text-shadow:0 0 12px #39ff88}
  #score{font-size:18px;margin-bottom:10px;color:#ffd23f}
  canvas{background:#101024;border:2px solid #2a2a4a;border-radius:12px;
    box-shadow:0 0 40px rgba(57,255,136,.25);touch-action:none}
  #msg{margin-top:10px;font-size:14px;color:#9a9ab0;min-height:20px}
  #over{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    flex-direction:column;background:rgba(11,11,20,.82)}
  #over b{font-size:34px;color:#ff5470;text-shadow:0 0 16px #ff5470}
  #over span{margin-top:8px;color:#e8e8f0}
  #over button{margin-top:16px;padding:10px 22px;font-size:16px;border:0;border-radius:8px;
    background:#39ff88;color:#0b0b14;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div id="wrap">
  <h1>NEON SNAKE</h1>
  <div id="score">SCORE 0</div>
  <canvas id="game" width="480" height="480"></canvas>
  <div id="msg">Arrow keys or swipe to steer — eat the dots, don't hit the walls!</div>
  <div id="over"><b>GAME OVER</b><span id="final"></span>
    <button onclick="reset()">PLAY AGAIN</button></div>
</div>
<script>
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const N = 16, CELL = 480 / N;           // 16x16 grid
let snake, dir, nextDir, food, score, speed, timer, alive, touchStart;

function placeFood() {
  while (true) {
    const f = { x: (Math.random() * N) | 0, y: (Math.random() * N) | 0 };
    if (!snake.some(s => s.x === f.x && s.y === f.y)) return f;
  }
}
function reset() {
  snake = [{ x: 8, y: 8 }, { x: 7, y: 8 }, { x: 6, y: 8 }];
  dir = nextDir = { x: 1, y: 0 };
  score = 0; speed = 160; alive = true;
  document.getElementById('over').style.display = 'none';
  document.getElementById('score').textContent = 'SCORE 0';
  food = placeFood();
  clearInterval(timer);
  timer = setInterval(tick, speed);
}
function tick() {
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N ||
      snake.some(s => s.x === head.x && s.y === head.y)) return gameOver();
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    document.getElementById('score').textContent = 'SCORE ' + score;
    food = placeFood();
    if (speed > 70) { speed -= 6; clearInterval(timer); timer = setInterval(tick, speed); }
  } else snake.pop();
  draw();
}
function gameOver() {
  alive = false; clearInterval(timer);
  document.getElementById('final').textContent = 'Final score: ' + score;
  document.getElementById('over').style.display = 'flex';
}
function draw() {
  ctx.fillStyle = '#101024'; ctx.fillRect(0, 0, 480, 480);
  ctx.strokeStyle = 'rgba(255,255,255,0.04)'; ctx.lineWidth = 1;
  for (let i = 1; i < N; i++) {
    ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, 480); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(480, i * CELL); ctx.stroke();
  }
  // food: glowing dot
  const fx = food.x * CELL + CELL / 2, fy = food.y * CELL + CELL / 2;
  const g = ctx.createRadialGradient(fx, fy, 2, fx, fy, CELL * 0.7);
  g.addColorStop(0, '#fff6b0'); g.addColorStop(0.4, '#ffd23f'); g.addColorStop(1, 'rgba(255,210,63,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(fx, fy, CELL * 0.7, 0, 7); ctx.fill();
  // snake: neon green, head brightest
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#a4ffc4' : `rgba(57,255,136,${1 - i / (snake.length + 6)})`;
    const p = 3, r = CELL / 2 - 2;
    ctx.beginPath();
    ctx.roundRect(s.x * CELL + p, s.y * CELL + p, CELL - p * 2, CELL - p * 2, r);
    ctx.fill();
  });
}
function steer(x, y) {
  if (!alive) return;
  if (x === -dir.x && y === -dir.y) return;   // no reversing
  nextDir = { x, y };
}
addEventListener('keydown', e => {
  const k = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] }[e.key];
  if (k) { e.preventDefault(); steer(k[0], k[1]); }
  if (e.key === ' ' && !alive) reset();
});
cv.addEventListener('touchstart', e => { touchStart = e.touches[0]; e.preventDefault(); }, { passive: false });
cv.addEventListener('touchend', e => {
  if (!touchStart) return;
  const t = e.changedTouches[0], dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
  steer(Math.abs(dx) > Math.abs(dy) ? Math.sign(dx) : 0, Math.abs(dx) > Math.abs(dy) ? 0 : Math.sign(dy));
}, { passive: false });
reset();
</script>
</body>
</html>
